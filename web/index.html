<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>klanki</title>
    <meta name="description" content="Powerful, intelligent spaced repetition flashcards." />
    <meta name="theme-color" content="#0284c7" />
    <meta name="color-scheme" content="light dark" />

    <!-- Instant theme initialization to prevent flash -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem("klanki_theme_preference");
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          } else if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <style>
      :root {
        --bg-init: #ffffff;
        --cyber-glow: #00F5FF;
        --duck-body: #A5DEFF;
        --duck-shade: #7BC4F5;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-init: #0f172a;
        }
      }
      :root[data-theme="dark"] {
        --bg-init: #0f172a;
      }
      body {
        margin: 0;
        background-color: var(--bg-init);
      }
      .init-duck-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-init);
      }
      .init-duck-svg {
        width: 200px;
        height: 222px;
        overflow: visible;
      }
      .init-duck-svg #leg-front {
        transform-origin: 71px 190px;
        animation: init-duck-walk 0.38s infinite alternate ease-in-out;
      }
      .init-duck-svg #leg-back {
        transform-origin: 117px 185px;
        animation: init-duck-walk 0.38s infinite alternate-reverse ease-in-out;
      }
      .init-duck-svg #torso {
        transform-origin: 100px 155px;
        animation: init-duck-bob 0.19s infinite alternate ease-in-out;
      }
      @keyframes init-duck-walk {
        0% { transform: rotate(-18deg); }
        100% { transform: rotate(18deg); }
      }
      @keyframes init-duck-bob {
        0% { transform: translateY(2px) rotate(-1.5deg); }
        100% { transform: translateY(-6px) rotate(2deg); }
      }
    </style>

    <!-- PWA & Apple Touch Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="klanki" />
    <meta name="application-name" content="klanki" />

    <!-- MathJax for rendering math and science formulas -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']]
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
    <!-- SQL.js WebAssembly for full .apkg import & export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="init-duck-stage">
        <svg class="init-duck-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 245">
          <defs>
            <linearGradient id="metal-outer" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#BCC6CF" />
              <stop offset="50%" stop-color="#8B97A3" />
              <stop offset="100%" stop-color="#5D6975" />
            </linearGradient>
            <linearGradient id="metal-inner" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5A6672" />
              <stop offset="100%" stop-color="#9BA7B3" />
            </linearGradient>
            <radialGradient id="core-grad" cx="42%" cy="42%" r="58%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="35%" stop-color="#00F5FF" />
              <stop offset="100%" stop-color="#0095B6" />
            </radialGradient>
          </defs>
          <g id="duck">
            <ellipse id="shadow" cx="98" cy="228" rx="52" ry="8" fill="#000000" opacity="0.24" />
            <g id="leg-back">
              <path d="M 108 172 L 126 172 L 126 208 L 108 208 Z" fill="url(#metal-outer)" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <path d="M 104 204 C 98 208, 99 218, 108 221 C 118 225, 136 226, 145 222 C 151 219, 150 214, 146 213 C 153 212, 155 206, 146 203 C 138 200, 129 201, 128 204 Z" fill="#F99B22" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
            </g>
            <g id="leg-front">
              <path d="M 62 176 L 80 176 L 78 218 L 60 216 Z" fill="url(#metal-outer)" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <path d="M 57 214 C 49 218, 46 229, 53 233 C 62 238, 75 241, 83 238 C 87 236, 87 231, 90 231 C 99 231, 104 227, 98 221 C 92 216, 84 214, 80 215 Z" fill="#FFA724" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
            </g>
            <g id="torso">
              <path d="M 86 122 L 143 118 L 151 138 C 128 145, 102 142, 85 132 Z" fill="url(#metal-outer)" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <path d="M 85 130 C 56 128, 30 144, 28 168 C 26 194, 54 209, 98 209 C 142 209, 168 190, 168 162 C 168 146, 159 136, 148 131 C 128 141, 104 139, 85 130 Z" fill="#A5DEFF" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <path d="M 118 26 C 113 13, 94 6, 82 10 C 74 13, 79 25, 86 32 C 74 29, 63 32, 63 40 C 63 45, 69 47, 74 47 C 56 60, 49 82, 56 102 C 63 121, 86 131, 114 131 C 147 131, 178 118, 184 94 C 190 66, 174 36, 144 27 C 134 24, 125 24, 118 26 Z" fill="#A5DEFF" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <circle cx="86" cy="90" r="21" fill="url(#metal-outer)" stroke="#253642" stroke-width="4" />
              <circle cx="86" cy="90" r="10.5" fill="url(#core-grad)" />
              <ellipse cx="140" cy="85" rx="8.5" ry="12.5" fill="#18242E" />
              <ellipse cx="142.5" cy="80" rx="3.2" ry="4.5" fill="#FFFFFF" />
              <path d="M 176 80 C 181 79, 189 87, 200 90 C 210 92, 214 94, 213 99 C 210 108, 193 116, 173 113 C 158 111, 151 105, 154 98 C 157 91, 169 81, 176 80 Z" fill="#FFA724" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
              <path d="M 82 138 C 58 138, 30 148, 26 164 C 23 176, 34 182, 45 178 C 43 188, 54 196, 68 193 C 88 189, 106 175, 106 157 C 106 144, 96 138, 82 138 Z" fill="#A5DEFF" stroke="#18242E" stroke-width="5" stroke-linejoin="round" />
            </g>
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
