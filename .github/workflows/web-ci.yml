name: Web App CI (klanki)

on:
  push:
    branches: [web-app, main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  verify-web:
    name: Typecheck, Unit Tests, Build & Worker Dry-Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck client & Cloudflare Worker server (strict)
        run: npm run typecheck

      - name: Run security, sync & scheduler verification tests
        run: npm test

      - name: Build production client bundle
        run: npm run build

      - name: Validate Cloudflare Worker bundle & bindings (dry-run)
        run: npx wrangler deploy --dry-run
